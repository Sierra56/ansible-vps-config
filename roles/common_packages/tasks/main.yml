---
- name: Update cache (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

#Отдельным таском ставим epel чтобы доступны были пакеты из списка common
- name: Install EPEL repo (RedHat)
  ansible.builtin.dnf:
    name: epel-release
    state: present
    update_cache: true
  when: ansible_facts.os_family == "RedHat"

- name: Install common packages (RedHat)
  ansible.builtin.package:
    name: "{{ packages_redhat if ansible_facts.os_family == 'RedHat' else packages_debian }}"
    state: present
  when: ansible_facts.os_family in ['RedHat', 'Debian']
